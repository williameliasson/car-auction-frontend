<!-- todo: conditionally show registerform or loginform based on users clicks and whether or not the user is logged in already  -->
<div id="registerform">
    <h2>Register</h2>
    <form>
        <label for="username">Username: </label>
        <input name="username" type="text" formControlName="username">

        <label for="password">Email: </label>
        <input type="text" name="email" formControlName="email">

        <label for="password">Password: </label>
        <input type="password" name="password" formControlName="password">
        
        <label for="repeat-password">Repeat Password: </label>
        <input type="password" name="repeat-password" formControlName="repeatPassword">
        <button type="submit" [disabled]="registerForm.invalid">Register</button>
    </form>
</div>
<div class="loginform">
    <h2>Login</h2>
    <form>
        <label for="username">Username: </label>
        <input name="username" type="text" formControlName="username">
    
        <label for="password">Password: </label>
        <input type="password" name="password" formControlName="password">
        
        <button>Login</button>
    </form>
</div>
